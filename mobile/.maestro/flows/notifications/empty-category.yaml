appId: com.kodofact.uddeepto
name: M201 An unused notification category shows an empty state
tags:
  - android
  - notifications
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- tapOn:
    id: icon-notifications
- extendedWaitUntil:
    visible:
      id: dropdown-all-categories
    timeout: 30000
- scrollUntilVisible:
    element:
      id: dropdown-all-categories
    direction: DOWN
    timeout: 30000
- tapOn:
    id: dropdown-all-categories
- repeat:
    times: 12
    while:
      notVisible:
        id: option-contests
    commands:
      - swipe:
          from:
            id: option-list
          direction: UP
          duration: 400
- tapOn:
    id: option-contests
- extendedWaitUntil:
    visible:
      text: You’re all caught up
    timeout: 30000
