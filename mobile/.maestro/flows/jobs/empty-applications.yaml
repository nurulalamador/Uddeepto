appId: com.kodofact.uddeepto
name: M176 New learner has no applications
tags:
  - android
  - jobs
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- tapOn:
    id: tab-jobs
- tapOn:
    id: top-tab-applied
- extendedWaitUntil:
    visible:
      text: No applications yet
    timeout: 30000
