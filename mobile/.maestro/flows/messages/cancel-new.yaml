appId: com.kodofact.uddeepto
name: M191 Cancelling person search returns to the inbox
tags:
  - android
  - messages
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- tapOn:
    id: icon-messages
- extendedWaitUntil:
    visible:
      text: New message
    timeout: 30000
- tapOn:
    text: New message
- extendedWaitUntil:
    visible:
      id: people-search
    timeout: 30000
- tapOn:
    text: Cancel
- extendedWaitUntil:
    visible:
      text: No conversations yet
    timeout: 30000
- assertNotVisible:
    id: people-search
