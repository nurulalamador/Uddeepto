appId: com.kodofact.uddeepto
name: M185 Hirer can mark an applicant accepted
tags:
  - android
  - jobs
  - writes
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: applicant-owner
      ACTOR_ROLE: hirer
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- tapOn:
    id: tab-hiring
- tapOn:
    id: top-tab-applicants
- extendedWaitUntil:
    visible:
      id: filter-search
    timeout: 30000
- scrollUntilVisible:
    element:
      id: filter-search
    direction: DOWN
    timeout: 30000
- tapOn:
    id: filter-search
- eraseText
- inputText: ${output.applicantName}
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: Maestro APPLY
    timeout: 30000
- scrollUntilVisible:
    element:
      id: dropdown-status
    direction: DOWN
    timeout: 30000
- tapOn:
    id: dropdown-status
- repeat:
    times: 12
    while:
      notVisible:
        id: option-accepted
    commands:
      - swipe:
          from:
            id: option-list
          direction: UP
          duration: 400
- tapOn:
    id: option-accepted
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-index
    timeout: 30000
- tapOn:
    id: tab-hiring
- tapOn:
    id: top-tab-applicants
- extendedWaitUntil:
    visible:
      id: filter-search
    timeout: 30000
- scrollUntilVisible:
    element:
      id: filter-search
    direction: DOWN
    timeout: 30000
- tapOn:
    id: filter-search
- eraseText
- inputText: ${output.applicantName}
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: Accepted
    timeout: 30000
