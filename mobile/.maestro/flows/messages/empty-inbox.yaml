appId: com.kodofact.uddeepto
name: M189 New account has an empty inbox
tags:
  - android
  - messages
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- tapOn:
    id: icon-messages
- extendedWaitUntil:
    visible:
      text: No conversations yet
    timeout: 30000
- assertVisible:
    text: New message
