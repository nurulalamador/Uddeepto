appId: com.kodofact.uddeepto
name: M013 New learner reaches the correct first screen
tags:
  - android
  - auth
  - writes
---
- runFlow:
    file: ../../helpers/reset.yaml
- tapOn:
    text: Create an account
- tapOn:
    id: register-role-learner
- scrollUntilVisible:
    element:
      id: input-full-name
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-full-name
- eraseText
- inputText: Maestro New learner
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-email
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-email
- eraseText
- inputText: ${REGISTER_LEARNER_USERNAME}@e2e.test
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-username
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-username
- eraseText
- inputText: ${REGISTER_LEARNER_USERNAME}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-password
- eraseText
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: button-create-account
    direction: DOWN
    timeout: 30000
- tapOn:
    id: button-create-account
- extendedWaitUntil:
    visible:
      text: What are you into\?
    timeout: 30000
