appId: com.kodofact.uddeepto
name: M248 Course list recovers after a temporary server failure
tags:
  - android
  - network
onFlowStart:
  - runScript: ../../scripts/clear-faults.js
onFlowComplete:
  - runScript: ../../scripts/clear-faults.js
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- runScript:
    file: ../../scripts/set-faults.js
    env:
      FAULTS: '[{"method":"GET","path":"/api/v1/frontend/catalog/courses","mode":"status","status":503,"message":"Maestro courses temporarily unavailable"}]'
- tapOn:
    id: tab-courses
- extendedWaitUntil:
    visible:
      text: Maestro courses temporarily unavailable
    timeout: 30000
- tapOn:
    id: button-try-again
- extendedWaitUntil:
    visible:
      id: course-card-.*
    timeout: 30000
