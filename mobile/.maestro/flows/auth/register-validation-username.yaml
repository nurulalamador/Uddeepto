appId: com.kodofact.uddeepto
name: M011 Registration rejects an invalid username
tags:
  - android
  - auth
---
- runFlow:
    file: ../../helpers/reset.yaml
- tapOn:
    text: Create an account
- scrollUntilVisible:
    element:
      id: input-full-name
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-full-name
- eraseText
- inputText: Maestro Example
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-email
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-email
- eraseText
- inputText: maestro@example.test
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-username
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-username
- eraseText
- inputText: has spaces
- hideKeyboard
- scrollUntilVisible:
    element:
      id: button-create-account
    direction: DOWN
    timeout: 30000
- tapOn:
    id: button-create-account
- assertVisible:
    text: 'Username: 3-40 letters, numbers, underscore, dot or hyphen.'
