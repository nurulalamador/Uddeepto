appId: com.kodofact.uddeepto
name: M120 Unsaved education entry can be discarded
tags:
  - android
  - education
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- openLink:
    link: uddeepto://education
- extendedWaitUntil:
    visible:
      id: button-add-education
    timeout: 30000
- tapOn:
    id: button-add-education
- extendedWaitUntil:
    visible:
      id: input-institution
    timeout: 30000
- scrollUntilVisible:
    element:
      id: input-institution
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-institution
- eraseText
- inputText: Unsaved entry
- hideKeyboard
- tapOn:
    id: entry-form-close
- extendedWaitUntil:
    visible:
      id: button-add-education
    timeout: 30000
- assertVisible:
    text: No education added yet.
