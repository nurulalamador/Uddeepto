appId: com.kodofact.uddeepto
name: M183 Jobs list loads records after the first page
tags:
  - android
  - jobs
  - writes
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: pagination-jobs
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- tapOn:
    id: tab-jobs
- extendedWaitUntil:
    visible:
      id: filter-search
    timeout: 30000
- scrollUntilVisible:
    element:
      id: filter-search
    direction: DOWN
    timeout: 30000
- tapOn:
    id: filter-search
- eraseText
- inputText: ${output.batchPrefix}
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: job-card-${output.pageFirstId}
    timeout: 30000
- scrollUntilVisible:
    element:
      id: job-card-${output.pageLastId}
    direction: DOWN
    timeout: 30000
