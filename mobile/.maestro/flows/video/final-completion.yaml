appId: com.kodofact.uddeepto
name: M239 Passing the final video check completes the lesson
tags:
  - android
  - video
  - writes
  - media
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: video-final
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- openLink:
    link: uddeepto://course/${VIDEO_COURSE_ID}/${VIDEO_MATERIAL_ID}
- extendedWaitUntil:
    visible:
      id: quiz-video
    timeout: 30000
- runFlow:
    file: ../../helpers/play-quiz.yaml
- extendedWaitUntil:
    visible:
      text: Final check
    timeout: 30000
- runFlow:
    file: ../../helpers/answer-quiz.yaml
- extendedWaitUntil:
    visible:
      id: button-done
    timeout: 30000
- assertVisible:
    text: 3 of 3 correct.*Lesson completed.*
- tapOn:
    id: button-done
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-index
    timeout: 30000
- openLink:
    link: uddeepto://course/${VIDEO_COURSE_ID}/${VIDEO_MATERIAL_ID}
- extendedWaitUntil:
    visible:
      id: video-player
    timeout: 30000
- assertNotVisible:
    id: quiz-video
