appId: com.kodofact.uddeepto
name: Enter credentials without assuming success
---
- scrollUntilVisible:
    element:
      id: input-username-or-email
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-username-or-email
- eraseText
- inputText: ${USERNAME}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-password
- eraseText
- inputText: ${LOGIN_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: button-sign-in
    direction: DOWN
    timeout: 30000
- tapOn:
    id: button-sign-in
