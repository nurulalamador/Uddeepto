appId: com.kodofact.uddeepto
name: M173 Remote mode hides location and switching back restores it
tags:
  - android
  - jobs
---
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${PUBLISH_HIRER_USERNAME}
- openLink:
    link: uddeepto://job-post
- extendedWaitUntil:
    visible:
      id: input-job-title
    timeout: 30000
- scrollUntilVisible:
    element:
      id: dropdown-interest-category
    direction: DOWN
    timeout: 30000
- tapOn:
    id: dropdown-interest-category
- repeat:
    times: 12
    while:
      notVisible:
        id: option-${CATEGORY_ID}
    commands:
      - swipe:
          from:
            id: option-list
          direction: UP
          duration: 400
- tapOn:
    id: option-${CATEGORY_ID}
- scrollUntilVisible:
    element:
      id: dropdown-work-mode
    direction: DOWN
    timeout: 30000
- tapOn:
    id: dropdown-work-mode
- repeat:
    times: 12
    while:
      notVisible:
        id: option-remote
    commands:
      - swipe:
          from:
            id: option-list
          direction: UP
          duration: 400
- tapOn:
    id: option-remote
- assertNotVisible:
    id: input-location
- scrollUntilVisible:
    element:
      id: dropdown-work-mode
    direction: DOWN
    timeout: 30000
- tapOn:
    id: dropdown-work-mode
- repeat:
    times: 12
    while:
      notVisible:
        id: option-onsite
    commands:
      - swipe:
          from:
            id: option-list
          direction: UP
          duration: 400
- tapOn:
    id: option-onsite
- assertVisible:
    id: input-location
