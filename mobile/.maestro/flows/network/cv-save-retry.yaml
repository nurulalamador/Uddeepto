appId: com.kodofact.uddeepto
name: M254 Failed CV save preserves the draft and succeeds after retry
tags:
  - android
  - network
  - writes
onFlowStart:
  - runScript: ../../scripts/clear-faults.js
onFlowComplete:
  - runScript: ../../scripts/clear-faults.js
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- openLink:
    link: uddeepto://cv
- extendedWaitUntil:
    visible:
      text: Your current CV
    timeout: 30000
- scrollUntilVisible:
    element:
      id: input-full-name
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-full-name
- eraseText
- inputText: Maestro CV Retry
- hideKeyboard
- runScript:
    file: ../../scripts/set-faults.js
    env:
      FAULTS: '[{"method":"PUT","path":"/api/v1/frontend/cv","mode":"status","status":503,"message":"Maestro CV temporarily unavailable"}]'
- tapOn:
    id: button-save-cv
- scrollUntilVisible:
    element:
      text: Maestro CV temporarily unavailable
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element:
      id: input-full-name
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: input-full-name
    text: Maestro CV Retry
- tapOn:
    id: button-save-cv
- extendedWaitUntil:
    visible:
      text: CV saved.*
    timeout: 30000
