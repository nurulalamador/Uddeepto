appId: com.kodofact.uddeepto
name: M193 Nonmember cannot open a private conversation by ID
tags:
  - android
  - messages
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- openLink:
    link: uddeepto://chat/${CONVERSATION_ID}
- extendedWaitUntil:
    visible:
      id: button-try-again
    timeout: 30000
- assertNotVisible:
    id: chat-input
- assertNotVisible:
    text: Maestro hello from Liam
