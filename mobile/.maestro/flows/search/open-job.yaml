appId: com.kodofact.uddeepto
name: M098 Search result opens the correct job detail
tags:
  - android
  - search
---
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${LEARNER_USERNAME}
- tapOn:
    id: icon-search
- extendedWaitUntil:
    visible:
      id: global-search
    timeout: 30000
- scrollUntilVisible:
    element:
      id: global-search
    direction: DOWN
    timeout: 30000
- tapOn:
    id: global-search
- eraseText
- inputText: ${JOB_TITLE}
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: search-result-jobs-${JOB_ID}
    timeout: 30000
- tapOn:
    id: search-result-jobs-${JOB_ID}
- extendedWaitUntil:
    visible:
      text: About the job
    timeout: 30000
