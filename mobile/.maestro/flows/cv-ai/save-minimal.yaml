appId: com.kodofact.uddeepto
name: M211 minimal template is saved and restored with the CV
tags:
  - android
  - cv-ai
  - writes
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- openLink:
    link: uddeepto://cv
- extendedWaitUntil:
    visible:
      text: Your current CV
    timeout: 30000
- scrollUntilVisible:
    element:
      id: dropdown-template
    direction: DOWN
    timeout: 30000
- tapOn:
    id: dropdown-template
- repeat:
    times: 12
    while:
      notVisible:
        id: option-minimal
    commands:
      - swipe:
          from:
            id: option-list
          direction: UP
          duration: 400
- tapOn:
    id: option-minimal
- tapOn:
    id: button-save-cv
- extendedWaitUntil:
    visible:
      text: CV saved.*
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-index
    timeout: 30000
- openLink:
    link: uddeepto://cv
- extendedWaitUntil:
    visible:
      text: Your current CV
    timeout: 30000
- scrollUntilVisible:
    element:
      id: dropdown-template
    direction: DOWN
    timeout: 30000
- tapOn:
    id: dropdown-template
- assertVisible:
    id: option-minimal
    selected: true
