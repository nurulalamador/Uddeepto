appId: com.kodofact.uddeepto
name: M207 CV starts with the signed-in profile name
tags:
  - android
  - cv-ai
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- openLink:
    link: uddeepto://cv
- extendedWaitUntil:
    visible:
      text: Your current CV
    timeout: 30000
- scrollUntilVisible:
    element:
      id: input-full-name
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: input-full-name
    text: ${output.actorName}
