appId: com.kodofact.uddeepto
name: M151 Course search explains that no course matches
tags:
  - android
  - learning
---
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${LEARNER_USERNAME}
- tapOn:
    id: tab-courses
- extendedWaitUntil:
    visible:
      id: filter-search
    timeout: 30000
- scrollUntilVisible:
    element:
      id: filter-search
    direction: DOWN
    timeout: 30000
- tapOn:
    id: filter-search
- eraseText
- inputText: zznone${RUN_ID}
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: No courses match
    timeout: 30000
