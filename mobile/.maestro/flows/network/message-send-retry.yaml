appId: com.kodofact.uddeepto
name: M253 Failed message send retains the draft and permits retry
tags:
  - android
  - network
  - writes
onFlowStart:
  - runScript: ../../scripts/clear-faults.js
onFlowComplete:
  - runScript: ../../scripts/clear-faults.js
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- openLink:
    link: uddeepto://user/${RECEIVER_ID}
- extendedWaitUntil:
    visible:
      id: button-send-message
    timeout: 30000
- tapOn:
    id: button-send-message
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 30000
- scrollUntilVisible:
    element:
      id: chat-input
    direction: DOWN
    timeout: 30000
- tapOn:
    id: chat-input
- eraseText
- inputText: Maestro retry ${output.unique}
- hideKeyboard
- runScript:
    file: ../../scripts/set-faults.js
    env:
      FAULTS: '[{"method":"POST","path":"/api/v1/frontend/messages/","mode":"status","status":503,"message":"Maestro message temporarily unavailable"}]'
- tapOn:
    id: chat-send
- extendedWaitUntil:
    visible:
      text: Maestro message temporarily unavailable
    timeout: 30000
- assertVisible:
    id: chat-input
    text: Maestro retry ${output.unique}
- tapOn:
    id: chat-send
- extendedWaitUntil:
    visible:
      text: Maestro retry ${output.unique}
    timeout: 30000
- assertVisible:
    id: chat-input
    text: ''
