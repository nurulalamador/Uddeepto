appId: com.kodofact.uddeepto
name: M004 Password visibility can be toggled both ways
tags:
  - android
  - auth
---
- runFlow:
    file: ../../helpers/reset.yaml
- scrollUntilVisible:
    element:
      id: input-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-password
- eraseText
- inputText: Visibility123
- hideKeyboard
- tapOn:
    text: Show password
- assertVisible:
    text: Hide password
- tapOn:
    text: Hide password
- assertVisible:
    text: Show password
