appId: com.kodofact.uddeepto
name: M219 Cancelling CV reset preserves unsaved edits
tags:
  - android
  - cv-ai
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- openLink:
    link: uddeepto://cv
- extendedWaitUntil:
    visible:
      text: Your current CV
    timeout: 30000
- scrollUntilVisible:
    element:
      id: input-full-name
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-full-name
- eraseText
- inputText: Unsaved CV Name
- hideKeyboard
- scrollUntilVisible:
    element:
      id: button-start-again-from-my-profile
    direction: UP
    timeout: 30000
- tapOn:
    id: button-start-again-from-my-profile
- tapOn:
    text: Cancel
- scrollUntilVisible:
    element:
      id: input-full-name
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: input-full-name
    text: Unsaved CV Name
