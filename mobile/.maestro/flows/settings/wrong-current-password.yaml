appId: com.kodofact.uddeepto
name: M204 Wrong current password is rejected without signing out
tags:
  - android
  - settings
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- openLink:
    link: uddeepto://settings
- extendedWaitUntil:
    visible:
      id: input-current-password
    timeout: 30000
- scrollUntilVisible:
    element:
      id: input-current-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-current-password
- eraseText
- inputText: WrongPassword123
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-new-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-new-password
- eraseText
- inputText: NewMaestro123
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-confirm-new-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-confirm-new-password
- eraseText
- inputText: NewMaestro123
- hideKeyboard
- scrollUntilVisible:
    element:
      id: button-change-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: button-change-password
- extendedWaitUntil:
    visible:
      text: Your current password is not correct
    timeout: 30000
- back
- assertVisible:
    id: tab-index
