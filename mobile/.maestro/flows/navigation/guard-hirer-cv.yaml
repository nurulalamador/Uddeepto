appId: com.kodofact.uddeepto
name: M093 Hirer cannot open the restricted cv route
tags:
  - android
  - navigation
---
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${HIRER_USERNAME}
- openLink:
    link: uddeepto://cv
- extendedWaitUntil:
    visible:
      id: tab-index
    timeout: 30000
- assertNotVisible:
    id: dropdown-template
