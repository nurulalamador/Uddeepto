appId: com.kodofact.uddeepto
name: M059 Hirer sees the seeded applicant and cover letter
tags:
  - android
  - jobs
---
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${HIRER_USERNAME}
- tapOn:
    id: tab-hiring
- tapOn:
    id: top-tab-applicants
- extendedWaitUntil:
    visible:
      id: filter-search
    timeout: 30000
- scrollUntilVisible:
    element:
      id: filter-search
    direction: DOWN
    timeout: 30000
- tapOn:
    id: filter-search
- eraseText
- inputText: Liam
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: Liam Learner
    timeout: 30000
- assertVisible:
    text: .*${JOB_TITLE}.*
- tapOn:
    text: Cover letter & resume
- assertVisible:
    text: Maestro applicant fixture
