appId: com.kodofact.uddeepto
name: M091 Signup password visibility can be toggled
tags:
  - android
  - auth
---
- runFlow:
    file: ../../helpers/reset.yaml
- tapOn:
    text: Create an account
- extendedWaitUntil:
    visible:
      id: input-full-name
    timeout: 30000
- scrollUntilVisible:
    element:
      id: input-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-password
- eraseText
- inputText: MaestroPassword123
- hideKeyboard
- tapOn:
    text: Show password
- assertVisible:
    text: Hide password
- tapOn:
    text: Hide password
- assertVisible:
    text: Show password
