appId: com.kodofact.uddeepto
name: M071 Changing password rejects mismatched confirmation
tags:
  - android
  - settings
---
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${SETTINGS_USERNAME}
- openLink:
    link: uddeepto://settings
- extendedWaitUntil:
    visible:
      id: input-current-password
    timeout: 30000
- scrollUntilVisible:
    element:
      id: input-current-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-current-password
- eraseText
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-new-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-new-password
- eraseText
- inputText: NewPassw0rd!123
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-confirm-new-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-confirm-new-password
- eraseText
- inputText: DifferentPass123
- hideKeyboard
- scrollUntilVisible:
    element:
      id: button-change-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: button-change-password
- assertVisible:
    text: The two new passwords do not match.
