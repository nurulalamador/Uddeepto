appId: com.kodofact.uddeepto
name: M081 Password change signs out sessions and accepts only the new password
tags:
  - android
  - settings
  - writes
  - destructive
---
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${PASSWORD_USERNAME}
- openLink:
    link: uddeepto://settings
- extendedWaitUntil:
    visible:
      id: input-current-password
    timeout: 30000
- scrollUntilVisible:
    element:
      id: input-current-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-current-password
- eraseText
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-new-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-new-password
- eraseText
- inputText: MaestroNewPass123
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-confirm-new-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-confirm-new-password
- eraseText
- inputText: MaestroNewPass123
- hideKeyboard
- scrollUntilVisible:
    element:
      id: button-change-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: button-change-password
- extendedWaitUntil:
    visible:
      text: Password changed
    timeout: 30000
- tapOn:
    text: OK
- extendedWaitUntil:
    visible:
      id: input-username-or-email
    timeout: 30000
- runFlow:
    file: ../../helpers/credentials.yaml
    env:
      USERNAME: ${PASSWORD_USERNAME}
      LOGIN_PASSWORD: ${PASSWORD}
- extendedWaitUntil:
    visible:
      text: Invalid credentials
    timeout: 30000
- runFlow:
    file: ../../helpers/credentials.yaml
    env:
      USERNAME: ${PASSWORD_USERNAME}
      LOGIN_PASSWORD: MaestroNewPass123
- extendedWaitUntil:
    visible:
      id: tab-index
    timeout: 30000
