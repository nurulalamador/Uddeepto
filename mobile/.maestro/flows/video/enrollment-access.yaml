appId: com.kodofact.uddeepto
name: M241 Unenrolled learner cannot open a private video lesson
tags:
  - android
  - video
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- openLink:
    link: uddeepto://course/${VIDEO_COURSE_ID}/${VIDEO_MATERIAL_ID}
- extendedWaitUntil:
    visible:
      id: button-try-again
    timeout: 30000
- assertNotVisible:
    id: quiz-video
- assertNotVisible:
    id: video-player
