appId: com.kodofact.uddeepto
name: M075 CV template can be selected without sharing a file
tags:
  - android
  - cv-ai
---
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${CV_USERNAME}
- openLink:
    link: uddeepto://cv
- extendedWaitUntil:
    visible:
      text: Your current CV
    timeout: 30000
- scrollUntilVisible:
    element:
      id: dropdown-template
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: dropdown-template
    direction: DOWN
    timeout: 30000
- tapOn:
    id: dropdown-template
- tapOn:
    id: option-modern
- tapOn:
    id: dropdown-template
- assertVisible:
    id: option-modern
    selected: true
- tapOn:
    id: option-modern
- scrollUntilVisible:
    element:
      id: input-full-name
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: input-full-name
    text: Maestro CV
