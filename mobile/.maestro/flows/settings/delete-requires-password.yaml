appId: com.kodofact.uddeepto
name: M072 Account deletion requires password confirmation
tags:
  - android
  - settings
---
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${SETTINGS_USERNAME}
- openLink:
    link: uddeepto://settings
- extendedWaitUntil:
    visible:
      id: input-current-password
    timeout: 30000
- scrollUntilVisible:
    element:
      id: button-delete-my-account
    direction: DOWN
    timeout: 30000
- tapOn:
    id: button-delete-my-account
- assertVisible:
    text: Enter your password to confirm.
