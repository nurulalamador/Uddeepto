appId: com.kodofact.uddeepto
name: M012 Registration rejects a short password
tags:
  - android
  - auth
---
- runFlow:
    file: ../../helpers/reset.yaml
- tapOn:
    text: Create an account
- scrollUntilVisible:
    element:
      id: input-full-name
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-full-name
- eraseText
- inputText: Maestro Example
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-email
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-email
- eraseText
- inputText: maestro@example.test
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-username
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-username
- eraseText
- inputText: valid_maestro
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-password
- eraseText
- inputText: short
- hideKeyboard
- scrollUntilVisible:
    element:
      id: button-create-account
    direction: DOWN
    timeout: 30000
- tapOn:
    id: button-create-account
- assertVisible:
    text: Password needs at least 8 characters.
