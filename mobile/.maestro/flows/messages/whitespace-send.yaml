appId: com.kodofact.uddeepto
name: M192 Whitespace-only direct messages cannot be sent
tags:
  - android
  - messages
---
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${CHAT_USERNAME}
- openLink:
    link: uddeepto://chat/${CONVERSATION_ID}
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 30000
- scrollUntilVisible:
    element:
      id: chat-input
    direction: DOWN
    timeout: 30000
- tapOn:
    id: chat-input
- eraseText
- inputText: '   '
- hideKeyboard
- assertVisible:
    id: chat-send
    enabled: false
