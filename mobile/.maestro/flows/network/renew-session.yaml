appId: com.kodofact.uddeepto
name: M250 A 401 renews the session and retries the original profile request
tags:
  - android
  - network
onFlowStart:
  - runScript: ../../scripts/clear-faults.js
onFlowComplete:
  - runScript: ../../scripts/clear-faults.js
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- runScript:
    file: ../../scripts/set-faults.js
    env:
      FAULTS: '[{"method":"GET","path":"/api/v1/frontend/profile","mode":"status","status":401}]'
- openLink:
    link: uddeepto://user/${output.actorId}
- extendedWaitUntil:
    visible:
      text: UDDEEPTO ID
    timeout: 30000
- assertNotVisible:
    id: input-username-or-email
