appId: com.kodofact.uddeepto
name: M205 Password change requires a different new password
tags:
  - android
  - settings
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- openLink:
    link: uddeepto://settings
- extendedWaitUntil:
    visible:
      id: input-current-password
    timeout: 30000
- scrollUntilVisible:
    element:
      id: input-current-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-current-password
- eraseText
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-new-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-new-password
- eraseText
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-confirm-new-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-confirm-new-password
- eraseText
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: button-change-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: button-change-password
- extendedWaitUntil:
    visible:
      text: Choose a new password that is different from the current one
    timeout: 30000
