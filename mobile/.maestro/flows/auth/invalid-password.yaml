appId: com.kodofact.uddeepto
name: M005 Wrong password cannot open the workspace
tags:
  - android
  - auth
---
- runFlow:
    file: ../../helpers/reset.yaml
- runFlow:
    file: ../../helpers/credentials.yaml
    env:
      USERNAME: ${LEARNER_USERNAME}
      LOGIN_PASSWORD: DefinitelyWrong123
- extendedWaitUntil:
    visible:
      text: Invalid credentials
    timeout: 30000
- assertVisible:
    id: input-username-or-email
- assertNotVisible:
    id: tab-index
