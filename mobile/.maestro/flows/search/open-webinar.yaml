appId: com.kodofact.uddeepto
name: M100 Search result opens the correct webinar detail
tags:
  - android
  - search
---
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${LEARNER_USERNAME}
- tapOn:
    id: icon-search
- extendedWaitUntil:
    visible:
      id: global-search
    timeout: 30000
- scrollUntilVisible:
    element:
      id: global-search
    direction: DOWN
    timeout: 30000
- tapOn:
    id: global-search
- eraseText
- inputText: Upcoming API Webinar
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: search-result-webinars-${WEBINAR_ID}
    timeout: 30000
- tapOn:
    id: search-result-webinars-${WEBINAR_ID}
- extendedWaitUntil:
    visible:
      text: Upcoming API Webinar
    timeout: 30000
