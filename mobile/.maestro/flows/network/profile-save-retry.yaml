appId: com.kodofact.uddeepto
name: M252 Failed profile save keeps edits and allows retry
tags:
  - android
  - network
  - writes
onFlowStart:
  - runScript: ../../scripts/clear-faults.js
onFlowComplete:
  - runScript: ../../scripts/clear-faults.js
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- openLink:
    link: uddeepto://edit-profile
- extendedWaitUntil:
    visible:
      id: input-full-name
    timeout: 30000
- scrollUntilVisible:
    element:
      id: input-full-name
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-full-name
- eraseText
- inputText: Maestro Retry Name
- hideKeyboard
- runScript:
    file: ../../scripts/set-faults.js
    env:
      FAULTS: '[{"method":"PATCH","path":"/api/v1/frontend/profile","mode":"status","status":503,"message":"Maestro profile temporarily unavailable"}]'
- scrollUntilVisible:
    element:
      id: button-save-profile
    direction: DOWN
    timeout: 30000
- tapOn:
    id: button-save-profile
- scrollUntilVisible:
    element:
      text: Maestro profile temporarily unavailable
    direction: UP
    timeout: 30000
- assertVisible:
    id: input-full-name
    text: Maestro Retry Name
- scrollUntilVisible:
    element:
      id: button-save-profile
    direction: DOWN
    timeout: 30000
- tapOn:
    id: button-save-profile
- extendedWaitUntil:
    visible:
      id: tab-index
    timeout: 30000
- openLink:
    link: uddeepto://edit-profile
- extendedWaitUntil:
    visible:
      id: input-full-name
    timeout: 30000
- assertVisible:
    id: input-full-name
    text: Maestro Retry Name
