appId: com.kodofact.uddeepto
name: M117 education requires an end date unless current
tags:
  - android
  - education
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- openLink:
    link: uddeepto://education
- extendedWaitUntil:
    visible:
      id: button-add-education
    timeout: 30000
- tapOn:
    id: button-add-education
- extendedWaitUntil:
    visible:
      id: input-institution
    timeout: 30000
- scrollUntilVisible:
    element:
      id: input-institution
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-institution
- eraseText
- inputText: Maestro entry ${output.unique}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: date-start-year
    direction: DOWN
    timeout: 30000
- tapOn:
    id: date-start-year
- scrollUntilVisible:
    element:
      id: option-search
    direction: DOWN
    timeout: 30000
- tapOn:
    id: option-search
- eraseText
- inputText: ${PAST_YEAR}
- hideKeyboard
- tapOn:
    id: option-${PAST_YEAR}
- scrollUntilVisible:
    element:
      id: button-save
    direction: DOWN
    timeout: 30000
- tapOn:
    id: button-save
- assertVisible:
    text: Choose when you finished, or mark that you still study here.
