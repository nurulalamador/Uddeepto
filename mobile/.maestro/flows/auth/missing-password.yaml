appId: com.kodofact.uddeepto
name: M003 Login requires a password
tags:
  - android
  - auth
---
- runFlow:
    file: ../../helpers/reset.yaml
- scrollUntilVisible:
    element:
      id: input-username-or-email
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-username-or-email
- eraseText
- inputText: ${LEARNER_USERNAME}
- hideKeyboard
- tapOn:
    id: button-sign-in
- assertVisible:
    text: Enter your username or email and your password.
