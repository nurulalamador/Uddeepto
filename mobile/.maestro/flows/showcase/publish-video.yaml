appId: com.kodofact.uddeepto
name: M149 video attachment uploads through the native picker
tags:
  - android
  - showcase
  - writes
  - media
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- addMedia:
    - ../../assets/lecture.mp4
- tapOn:
    id: tab-showcase
- tapOn:
    text: Create a post
- extendedWaitUntil:
    visible:
      id: input-what-do-you-want-to-share
    timeout: 30000
- scrollUntilVisible:
    element:
      id: input-what-do-you-want-to-share
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-what-do-you-want-to-share
- eraseText
- inputText: Maestro media ${output.unique}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: dropdown-interest
    direction: DOWN
    timeout: 30000
- tapOn:
    id: dropdown-interest
- repeat:
    times: 12
    while:
      notVisible:
        id: option-${CATEGORY_ID}
    commands:
      - swipe:
          from:
            id: option-list
          direction: UP
          duration: 400
- tapOn:
    id: option-${CATEGORY_ID}
- tapOn:
    id: button-video
- runFlow:
    file: ../../helpers/pick-photo.yaml
- extendedWaitUntil:
    visible:
      id: attachment-0
    timeout: 30000
- scrollUntilVisible:
    element:
      id: button-publish-post
    direction: DOWN
    timeout: 30000
- tapOn:
    id: button-publish-post
- extendedWaitUntil:
    visible:
      id: filter-search
    timeout: 30000
- scrollUntilVisible:
    element:
      id: filter-search
    direction: DOWN
    timeout: 30000
- tapOn:
    id: filter-search
- eraseText
- inputText: Maestro media ${output.unique}
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: post-card-.*
    timeout: 30000
- tapOn:
    id: post-card-.*
- extendedWaitUntil:
    visible:
      id: video-player
    timeout: 30000
