appId: com.kodofact.uddeepto
name: M194 Nonmember cannot read a protected community channel
tags:
  - android
  - messages
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- openLink:
    link: uddeepto://community/${COMMUNITY_ID}/${CHANNEL_ID}
- extendedWaitUntil:
    visible:
      id: button-try-again
    timeout: 30000
- assertNotVisible:
    id: chat-input
