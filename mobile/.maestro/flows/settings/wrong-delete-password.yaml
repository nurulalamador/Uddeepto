appId: com.kodofact.uddeepto
name: M206 Incorrect deletion password preserves the account
tags:
  - android
  - settings
---
- runScript:
    file: ../../scripts/prepare-case.js
    env:
      SCENARIO: basic
      ACTOR_ROLE: learner
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${output.actorUsername}
- openLink:
    link: uddeepto://settings
- extendedWaitUntil:
    visible:
      id: input-current-password
    timeout: 30000
- scrollUntilVisible:
    element:
      id: input-password
    direction: DOWN
    timeout: 30000
- tapOn:
    id: input-password
- eraseText
- inputText: WrongPassword123
- hideKeyboard
- scrollUntilVisible:
    element:
      id: button-delete-my-account
    direction: DOWN
    timeout: 30000
- tapOn:
    id: button-delete-my-account
- tapOn:
    text: Delete forever
- extendedWaitUntil:
    visible:
      text: Your password is not correct
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-index
    timeout: 30000
- assertNotVisible:
    id: input-username-or-email
